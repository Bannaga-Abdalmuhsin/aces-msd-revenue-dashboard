openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ACES MSD Revenue Dashboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: records
    description: Revenue record operations
  - name: projects
    description: Project operations
  - name: dashboard
    description: Dashboard analytics
  - name: invoices
    description: Invoice register
  - name: forecast
    description: Forecast data
  - name: validation
    description: Data quality validation
  - name: audit
    description: Audit log
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /records:
    get:
      operationId: listRecords
      tags: [records]
      summary: List revenue records with filters
      parameters:
        - name: project
          in: query
          schema: { type: string }
        - name: projectStatus
          in: query
          schema: { type: string }
        - name: revenueYear
          in: query
          schema: { type: ["number", "null"] }
        - name: revenueMonth
          in: query
          schema: { type: ["number", "null"] }
        - name: invoiceStatus
          in: query
          schema: { type: string }
        - name: invoiceNo
          in: query
          schema: { type: string }
        - name: dateFrom
          in: query
          schema: { type: string }
        - name: dateTo
          in: query
          schema: { type: string }
        - name: overdue
          in: query
          schema: { type: ["boolean", "null"] }
        - name: page
          in: query
          schema: { type: number, default: 1 }
        - name: pageSize
          in: query
          schema: { type: number, default: 50 }
      responses:
        "200":
          description: List of records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordListResponse"
    post:
      operationId: createRecord
      tags: [records]
      summary: Create a revenue record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueRecord"

  /records/import:
    post:
      operationId: importRecords
      tags: [records]
      summary: Import records from Excel/CSV (JSON parsed client-side)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportPayload"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"

  /records/{id}:
    get:
      operationId: getRecord
      tags: [records]
      summary: Get a revenue record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueRecord"
        "404":
          description: Not found
    patch:
      operationId: updateRecord
      tags: [records]
      summary: Update a revenue record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueRecord"
        "404":
          description: Not found
    delete:
      operationId: deleteRecord
      tags: [records]
      summary: Delete a revenue record
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects with aggregated stats
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectSummary"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get project detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "404":
          description: Not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "204":
          description: Deleted

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get KPI summary cards
      parameters:
        - name: project
          in: query
          schema: { type: string }
        - name: revenueYear
          in: query
          schema: { type: ["number", "null"] }
        - name: revenueMonth
          in: query
          schema: { type: ["number", "null"] }
        - name: projectStatus
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Summary KPIs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/monthly:
    get:
      operationId: getMonthlyTrend
      tags: [dashboard]
      summary: Get monthly financial trend data for charts
      parameters:
        - name: project
          in: query
          schema: { type: string }
        - name: revenueYear
          in: query
          schema: { type: ["number", "null"] }
      responses:
        "200":
          description: Monthly trend
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyTrendPoint"

  /dashboard/project-performance:
    get:
      operationId: getProjectPerformance
      tags: [dashboard]
      summary: Get project performance data for charts
      parameters:
        - name: revenueYear
          in: query
          schema: { type: ["number", "null"] }
      responses:
        "200":
          description: Project performance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectPerformance"

  /dashboard/aging:
    get:
      operationId: getAgingReport
      tags: [dashboard]
      summary: Get outstanding aging buckets
      parameters:
        - name: project
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Aging report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgingReport"

  /dashboard/insights:
    get:
      operationId: getInsights
      tags: [dashboard]
      summary: Get automated management insights
      responses:
        "200":
          description: Insights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Insight"

  /dashboard/collection-trend:
    get:
      operationId: getCollectionTrend
      tags: [dashboard]
      summary: Get monthly collection trend grouped by collected date
      parameters:
        - name: project
          in: query
          schema: { type: string }
        - name: revenueYear
          in: query
          schema: { type: ["number", "null"] }
      responses:
        "200":
          description: Collection trend
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CollectionTrendPoint"

  /dashboard/heatmap:
    get:
      operationId: getRevenueHeatmap
      tags: [dashboard]
      summary: Get revenue achievement heatmap data (projects x months)
      parameters:
        - name: revenueYear
          in: query
          schema: { type: ["number", "null"] }
      responses:
        "200":
          description: Heatmap data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeatmapData"

  /dashboard/payment-status:
    get:
      operationId: getPaymentStatusDistribution
      tags: [dashboard]
      summary: Get payment status distribution
      parameters:
        - name: project
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Payment status distribution
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentStatusCount"

  /invoices:
    get:
      operationId: listInvoices
      tags: [invoices]
      summary: Get invoice register with full detail
      parameters:
        - name: project
          in: query
          schema: { type: string }
        - name: invoiceNo
          in: query
          schema: { type: string }
        - name: paymentStatus
          in: query
          schema: { type: string }
        - name: overdue
          in: query
          schema: { type: ["boolean", "null"] }
        - name: dateFrom
          in: query
          schema: { type: string }
        - name: dateTo
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: number, default: 1 }
        - name: pageSize
          in: query
          schema: { type: number, default: 50 }
      responses:
        "200":
          description: Invoice register
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceListResponse"

  /forecast:
    get:
      operationId: getForecast
      tags: [forecast]
      summary: Get forecast data (expected collections, outstanding by due date)
      responses:
        "200":
          description: Forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForecastData"

  /validation:
    get:
      operationId: getValidationIssues
      tags: [validation]
      summary: Get data quality validation issues
      responses:
        "200":
          description: Validation issues
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ValidationIssue"

  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit log entries
      parameters:
        - name: page
          in: query
          schema: { type: number, default: 1 }
        - name: pageSize
          in: query
          schema: { type: number, default: 50 }
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"

  /records/demo/clear:
    delete:
      operationId: clearDemoData
      tags: [records]
      summary: Clear all demo/seed data
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearDemoResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    RevenueRecord:
      type: object
      required: [id, projectName, revenueMonth, workOrder, revenue, deductible, invoiced, collected, penalties, netRevenue, paymentStatus, isDemo]
      properties:
        id: { type: number }
        projectId: { type: ["number", "null"] }
        projectName: { type: string }
        revenueMonth: { type: string, description: "ISO date YYYY-MM-DD (first day of month)" }
        workOrder: { type: number }
        revenue: { type: number }
        deductible: { type: number }
        invoiced: { type: number }
        invoiceDate: { type: ["string", "null"] }
        invoiceNo: { type: ["string", "null"] }
        dueDate: { type: ["string", "null"] }
        collected: { type: number }
        collectedDate: { type: ["string", "null"] }
        days: { type: ["number", "null"] }
        penalties: { type: number }
        netRevenue: { type: number }
        paymentStatus: { type: string }
        outstandingAmount: { type: number }
        overdueAmount: { type: number }
        outstandingAgeDays: { type: ["number", "null"] }
        deductibleVariance: { type: ["number", "null"] }
        netRevenueVariance: { type: ["number", "null"] }
        isDemo: { type: boolean }
        createdAt: { type: string }
        updatedAt: { type: string }

    RecordInput:
      type: object
      required: [projectName, revenueMonth, workOrder, revenue]
      properties:
        projectName: { type: string }
        revenueMonth: { type: string }
        workOrder: { type: number }
        revenue: { type: number }
        deductible: { type: number }
        invoiced: { type: number }
        invoiceDate: { type: ["string", "null"] }
        invoiceNo: { type: ["string", "null"] }
        dueDate: { type: ["string", "null"] }
        collected: { type: number }
        collectedDate: { type: ["string", "null"] }
        days: { type: ["number", "null"] }
        penalties: { type: number }
        netRevenue: { type: number }
        isDemo: { type: boolean }

    RecordUpdate:
      type: object
      properties:
        projectName: { type: string }
        revenueMonth: { type: string }
        workOrder: { type: number }
        revenue: { type: number }
        deductible: { type: number }
        invoiced: { type: number }
        invoiceDate: { type: ["string", "null"] }
        invoiceNo: { type: ["string", "null"] }
        dueDate: { type: ["string", "null"] }
        collected: { type: number }
        collectedDate: { type: ["string", "null"] }
        days: { type: ["number", "null"] }
        penalties: { type: number }
        netRevenue: { type: number }

    RecordListResponse:
      type: object
      required: [data, total, page, pageSize]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RevenueRecord"
        total: { type: number }
        page: { type: number }
        pageSize: { type: number }

    ImportPayload:
      type: object
      required: [records]
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/RecordInput"
        allowDuplicateInvoices: { type: boolean }

    ImportResult:
      type: object
      required: [imported, skipped, warnings, errors]
      properties:
        imported: { type: number }
        skipped: { type: number }
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ImportWarning"
        errors:
          type: array
          items: { type: string }

    ImportWarning:
      type: object
      required: [row, field, message, severity]
      properties:
        row: { type: number }
        field: { type: string }
        message: { type: string }
        severity: { type: string, enum: [warning, error] }

    Project:
      type: object
      required: [id, name, status, createdAt]
      properties:
        id: { type: number }
        name: { type: string }
        status: { type: string, enum: [ongoing, completed, closed] }
        contractStart: { type: ["string", "null"] }
        contractEnd: { type: ["string", "null"] }
        poValue: { type: number }
        expectedMonthlyRevenue: { type: number }
        createdAt: { type: string }
        updatedAt: { type: string }

    ProjectInput:
      type: object
      required: [name, status]
      properties:
        name: { type: string }
        status: { type: string, enum: [ongoing, completed, closed] }
        contractStart: { type: ["string", "null"] }
        contractEnd: { type: ["string", "null"] }
        poValue: { type: number }
        expectedMonthlyRevenue: { type: number }

    ProjectUpdate:
      type: object
      properties:
        name: { type: string }
        status: { type: string, enum: [ongoing, completed, closed] }
        contractStart: { type: ["string", "null"] }
        contractEnd: { type: ["string", "null"] }
        poValue: { type: number }
        expectedMonthlyRevenue: { type: number }

    ProjectSummary:
      type: object
      required: [id, name, status, totalWorkOrder, totalRevenue, totalDeductible, totalInvoiced, totalCollected, totalOutstanding, totalOverdue, totalPenalties, totalNetRevenue, revenueAchievementPct, collectionPct, avgCollectionDays, poValue, expectedMonthlyRevenue, totalExpectedRevenue, remainingPO]
      properties:
        id: { type: number }
        name: { type: string }
        status: { type: string }
        contractStart: { type: ["string", "null"] }
        contractEnd: { type: ["string", "null"] }
        poValue: { type: number }
        expectedMonthlyRevenue: { type: number }
        totalExpectedRevenue: { type: number }
        remainingPO: { type: number }
        totalWorkOrder: { type: number }
        totalRevenue: { type: number }
        totalDeductible: { type: number }
        totalInvoiced: { type: number }
        totalCollected: { type: number }
        totalOutstanding: { type: number }
        totalOverdue: { type: number }
        totalPenalties: { type: number }
        totalNetRevenue: { type: number }
        revenueAchievementPct: { type: number }
        collectionPct: { type: number }
        avgCollectionDays: { type: number }
        latestRevenueMonth: { type: ["string", "null"] }
        latestInvoiceDate: { type: ["string", "null"] }

    ProjectDetail:
      type: object
      required: [project, monthlyTrend, records]
      properties:
        project:
          $ref: "#/components/schemas/ProjectSummary"
        monthlyTrend:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyTrendPoint"
        records:
          type: array
          items:
            $ref: "#/components/schemas/RevenueRecord"

    DashboardSummary:
      type: object
      required: [totalWorkOrder, totalRevenue, totalDeductible, totalInvoiced, totalCollected, totalOutstanding, totalOverdue, totalPenalties, totalNetRevenue, totalPoValue, totalExpectedRevenue, collectionRate, revenueAchievementRate, invoiceConversionRate, avgCollectionDays, lastDataUpdate]
      properties:
        totalWorkOrder: { type: number }
        totalRevenue: { type: number }
        totalDeductible: { type: number }
        totalInvoiced: { type: number }
        totalCollected: { type: number }
        totalOutstanding: { type: number }
        totalOverdue: { type: number }
        totalPenalties: { type: number }
        totalNetRevenue: { type: number }
        totalPoValue: { type: number }
        totalExpectedRevenue: { type: number }
        collectionRate: { type: number }
        revenueAchievementRate: { type: number }
        invoiceConversionRate: { type: number }
        avgCollectionDays: { type: number }
        lastDataUpdate: { type: ["string", "null"] }

    MonthlyTrendPoint:
      type: object
      required: [month, workOrder, revenue, invoiced, collected, netRevenue, expectedRevenue]
      properties:
        month: { type: string, description: "YYYY-MM" }
        workOrder: { type: number }
        revenue: { type: number }
        expectedRevenue: { type: number }
        invoiced: { type: number }
        collected: { type: number }
        netRevenue: { type: number }

    ProjectPerformance:
      type: object
      required: [projectName, workOrder, revenue, revenueAchievementPct, invoiced, collected, outstanding, expectedRevenue, poValue]
      properties:
        projectName: { type: string }
        workOrder: { type: number }
        revenue: { type: number }
        revenueAchievementPct: { type: number }
        invoiced: { type: number }
        collected: { type: number }
        outstanding: { type: number }
        expectedRevenue: { type: number }
        poValue: { type: number }

    AgingBucket:
      type: object
      required: [label, count, amount]
      properties:
        label: { type: string }
        count: { type: number }
        amount: { type: number }

    AgingReport:
      type: object
      required: [buckets, totalOutstanding]
      properties:
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/AgingBucket"
        totalOutstanding: { type: number }

    Insight:
      type: object
      required: [type, severity, message, amount]
      properties:
        type: { type: string }
        severity: { type: string, enum: [critical, warning, info] }
        message: { type: string }
        projectName: { type: ["string", "null"] }
        amount: { type: ["number", "null"] }

    CollectionTrendPoint:
      type: object
      required: [month, collected, count]
      properties:
        month: { type: string, description: "YYYY-MM" }
        collected: { type: number }
        count: { type: number }

    HeatmapRow:
      type: object
      required: [projectName, cells]
      properties:
        projectName: { type: string }
        cells:
          type: array
          items:
            $ref: "#/components/schemas/HeatmapCell"

    HeatmapCell:
      type: object
      required: [month, achievementPct]
      properties:
        month: { type: string }
        achievementPct: { type: ["number", "null"] }

    HeatmapData:
      type: object
      required: [months, rows]
      properties:
        months:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            $ref: "#/components/schemas/HeatmapRow"

    PaymentStatusCount:
      type: object
      required: [status, count, amount]
      properties:
        status: { type: string }
        count: { type: number }
        amount: { type: number }

    InvoiceRecord:
      type: object
      required: [id, projectName, revenueMonth, invoiceNo, invoiceDate, dueDate, invoiced, collected, outstanding, collectedDate, days, outstandingAgeDays, penalties, netRevenue, paymentStatus]
      properties:
        id: { type: number }
        projectName: { type: string }
        revenueMonth: { type: string }
        invoiceNo: { type: ["string", "null"] }
        invoiceDate: { type: ["string", "null"] }
        dueDate: { type: ["string", "null"] }
        invoiced: { type: number }
        collected: { type: number }
        outstanding: { type: number }
        collectedDate: { type: ["string", "null"] }
        days: { type: ["number", "null"] }
        outstandingAgeDays: { type: ["number", "null"] }
        penalties: { type: number }
        netRevenue: { type: number }
        paymentStatus: { type: string }

    InvoiceListResponse:
      type: object
      required: [data, total, page, pageSize]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceRecord"
        total: { type: number }
        page: { type: number }
        pageSize: { type: number }

    ForecastMonth:
      type: object
      required: [month, expectedCollection, outstanding, isActual]
      properties:
        month: { type: string }
        expectedCollection: { type: number }
        outstanding: { type: number }
        workOrder: { type: number }
        revenue: { type: ["number", "null"] }
        isActual: { type: boolean }

    ForecastData:
      type: object
      required: [months, next30, next60, next90]
      properties:
        months:
          type: array
          items:
            $ref: "#/components/schemas/ForecastMonth"
        next30: { type: number }
        next60: { type: number }
        next90: { type: number }

    ValidationIssue:
      type: object
      required: [recordId, field, message, severity]
      properties:
        recordId: { type: number }
        projectName: { type: string }
        revenueMonth: { type: string }
        invoiceNo: { type: ["string", "null"] }
        field: { type: string }
        message: { type: string }
        severity: { type: string, enum: [error, warning] }
        importedValue: { type: ["string", "null"] }
        calculatedValue: { type: ["string", "null"] }

    AuditLog:
      type: object
      required: [id, action, tableName, recordId, createdAt]
      properties:
        id: { type: number }
        user: { type: ["string", "null"] }
        action: { type: string }
        tableName: { type: string }
        recordId: { type: ["number", "null"] }
        previousValue: { type: ["string", "null"] }
        newValue: { type: ["string", "null"] }
        createdAt: { type: string }

    AuditLogListResponse:
      type: object
      required: [data, total, page, pageSize]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        total: { type: number }
        page: { type: number }
        pageSize: { type: number }

    ClearDemoResult:
      type: object
      required: [deleted]
